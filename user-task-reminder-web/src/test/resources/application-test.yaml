# Integration-test profile: in-memory H2 with the real Flyway migrations and no
# background schedulers, so nothing external is required and nothing fires on a timer.
spring:
  datasource:
    url: jdbc:h2:mem:utr-web-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  scheduler:
    # Scheduled jobs are invoked directly by the tests instead of on a timer.
    enabled: false
  notifications:
    default-channel: WEB
    max-delivery-attempts: 3
    email:
      enabled: false

logging:
  level:
    root: WARN
    com.neko: INFO
