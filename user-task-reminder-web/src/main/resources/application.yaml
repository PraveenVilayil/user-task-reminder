# Default profile is dev (in-memory H2). Run with SPRING_PROFILES_ACTIVE=prod for PostgreSQL.
# Every value below can be overridden by an environment variable; see .env.example.
spring:
  application:
    name: user-task-reminder
  profiles:
    default: dev
  jpa:
    # Schema is owned by Flyway, never by Hibernate.
    hibernate:
      ddl-auto: none
    # Off deliberately: services map entities to DTOs inside their own transaction,
    # so no lazy loading should ever escape to the view layer.
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  scheduler:
    # Set false to run the API without any background jobs.
    enabled: ${SCHEDULER_ENABLED:true}
    reminder-initial-delay-ms: ${REMINDER_INITIAL_DELAY_MS:10000}
    reminder-poll-interval-ms: ${REMINDER_POLL_INTERVAL_MS:30000}
    overdue-initial-delay-ms: ${OVERDUE_INITIAL_DELAY_MS:20000}
    overdue-poll-interval-ms: ${OVERDUE_POLL_INTERVAL_MS:300000}
    delivery-retry-initial-delay-ms: ${DELIVERY_RETRY_INITIAL_DELAY_MS:30000}
    delivery-retry-interval-ms: ${DELIVERY_RETRY_INTERVAL_MS:120000}
  notifications:
    default-channel: ${NOTIFICATIONS_DEFAULT_CHANNEL:WEB}
    max-delivery-attempts: ${NOTIFICATIONS_MAX_DELIVERY_ATTEMPTS:3}
    email:
      # Off by default so the app, its tests and CI never need an SMTP server.
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      from: ${NOTIFICATIONS_EMAIL_FROM:no-reply@user-task-reminder.local}
      subject-prefix: ${NOTIFICATIONS_EMAIL_SUBJECT_PREFIX:[Task Reminder] }

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.neko: ${LOG_LEVEL_APP:INFO}

---
# ---------------------------------------------------------------------------
# dev: in-memory H2, no external services required.
# H2 console at http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:usertaskreminder)
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:usertaskreminder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

---
# ---------------------------------------------------------------------------
# prod: PostgreSQL. Credentials come from the environment only - never commit them.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_task_reminder}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
