name: CI

on:
  push:
    branches: [ main, master, revamp ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Java 21: the reactor sets java.version to 21 and the code uses
      # language features from it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test the whole reactor
        # verify runs surefire (unit) and failsafe (integration). Everything
        # runs against in-memory H2, so no services are needed here.
        run: ./mvnw -B clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Build the container image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only; nothing is pushed from CI.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: user-task-reminder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
